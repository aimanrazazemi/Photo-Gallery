<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>After Hours · Photo Dump</title>
<meta name="description" content="A personal collection of photographs taken in free time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Birthstone+Bounce:wght@500&family=Gloock&family=Gilda+Display&family=Herr+Von+Muellerhoff&display=swap">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<header class="bar">
  <a class="brand" href="#" id="brand">Photo Dump</a>
</header>

<main>
  <section class="hero">
    <div class="hero-art">
      <h1 class="hero-title" id="intro-title"><span class="after" data-echo="After">After</span><span class="script" data-echo="Hours">Hours</span></h1>
      <svg class="spill" id="spill" viewBox="0 0 640 225" role="img" aria-label="Illustrated portrait of Aiman Razazemi" focusable="false"><image class="portrait" href="images/portrait.webp" x="384" y="-16" width="262" height="262"/></svg>
    </div>
    <div class="hero-meta">
      <p class="intro-by" id="intro-by"><span class="by-label">A photo<br>collection by</span><img class="sig" src="images/signature.webp" alt="Aiman Razazemi" width="1400" height="392"></p>
      <p class="intro-tagline" id="intro-tagline"></p>
    </div>
  </section>

  <nav class="index" id="divider" aria-label="Categories">
    <div class="filters" id="filters"></div>
    <div class="shot-on"><span>Shot on</span><b class="fuji">FUJ<span class="fuji-i">I</span>FILM</b></div>
  </nav>

  <section class="gallery" id="gallery" aria-live="polite"></section>
</main>

<footer class="foot">
  <span id="foot-author"></span>
</footer>

<div class="counter" id="counter" aria-hidden="true"><span id="counter-now">01</span> / <span id="counter-total">30</span></div>

<script src="js/photos.js"></script>
<script src="js/main.js"></script>
</body>
</html>
