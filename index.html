<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>After Hours · Photo Dump</title>
<meta name="description" content="A personal collection of photographs taken in free time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Mrs+Saint+Delafield&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="grid-lines" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<header class="bar">
  <a class="brand" href="#" id="brand">Photo Dump</a>
  <nav class="filters" id="filters" aria-label="Categories"></nav>
</header>

<main>
  <section class="intro">
    <div class="intro-head">
      <h1 class="intro-title" id="intro-title"><span>After</span><span class="script">Hours</span></h1>
      <p class="intro-by" id="intro-by">by Aiman Razazemi</p>
    </div>
    <div class="intro-meta">
      <img class="intro-portrait" src="images/portrait.webp" alt="Illustrated portrait of Aiman Razazemi" width="480" height="480">
      <p class="intro-tagline" id="intro-tagline"></p>
    </div>
  </section>

  <hr class="divider" id="divider">

  <section class="gallery" id="gallery" aria-live="polite"></section>
</main>

<footer class="foot">
  <span id="foot-author"></span>
  <span class="foot-hint"><span class="hint-desk">Hover or tap</span><span class="hint-touch">Tap</span> a photo for details</span>
</footer>

<div class="counter" id="counter" aria-hidden="true"><span id="counter-now">01</span> / <span id="counter-total">30</span></div>

<script src="js/photos.js"></script>
<script src="js/main.js"></script>
</body>
</html>
